<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffe7f1" />
  <title>はみがき</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app" aria-label="はみがきアプリ">
    <img class="main-art" src="main.jpg" alt="" draggable="false" />

    <button id="startButton" class="apple-hit" aria-label="スタート / もう一回"></button>

    <div class="brush-motion" aria-hidden="true"></div>
    <div class="foam foam-a" aria-hidden="true"></div>
    <div class="foam foam-b" aria-hidden="true"></div>
    <div class="foam foam-c" aria-hidden="true"></div>
    <div class="foam foam-d" aria-hidden="true"></div>

    <div id="clean1" class="clean-patch left" aria-hidden="true"></div>
    <div id="clean2" class="clean-patch center" aria-hidden="true"></div>
    <div id="clean3" class="clean-patch right" aria-hidden="true"></div>

    <div id="burst1" class="clean-burst left" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="burst2" class="clean-burst center" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="burst3" class="clean-burst right" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <div id="actionFx" class="action-fx" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div id="finishSparkles" class="finish-sparkles" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div id="portraitGuide" class="portrait-guide" aria-hidden="true">
      <div class="phone">↻</div>
    </div>

    <audio id="song" src="brush_song.m4a" preload="auto" playsinline></audio>
  </main>
  <script src="app.js"></script>
</body>
</html>
